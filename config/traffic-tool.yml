interfaces:
  - key: fruit
    name: Fruit Interface
    protocol: UDP
    port: 5001
    serdesFile: serdes/fruit.protocol.json

  - key: weather
    name: Weather Interface
    protocol: UDP
    port: 5002
    serdesFile: serdes/weather.protocol.json

  - key: ping
    name: Ping Interface
    protocol: UDP
    port: 5003
    serdesFile: serdes/ping.protocol.json

  - key: candy
    name: Candy Interface
    protocol: TCP
    port: 5004
    serdesFile: serdes/candy.protocol.json

  - key: greeting
    name: Greeting Interface
    protocol: UDP
    port: 5005
    serdesFile: serdes/greeting.protocol.json

  - key: rada
    name: Rada Interface
    protocol: UDP
    port: 5050
    byteOrder: BIG_ENDIAN
    serdesFile: serdes/rada.protocol.json
    serdesHeaderType: RadaHeader
    opcodeFieldName: msgType
    messageOwnsHeader: true
    # Interface-level byteOrder (BIG_ENDIAN above) applies to every message here, including
    # RadaExtendedStatus - compare with the `rada-le` interface below, which decodes the same
    # message type as LITTLE_ENDIAN instead. All 4 messages (RadaStatus/RadaExtendedStatus/
    # RadaExtendedStatusMrs/RadaTracksExtended) are auto-discovered from serdesFile - no
    # messages: list needed, same as every other serdesFile-backed interface above.

  - key: rada-le
    name: Rada Interface (Little Endian Extended Status)
    protocol: UDP
    port: 5051
    byteOrder: LITTLE_ENDIAN
    serdesFile: serdes/rada.protocol.json
    serdesHeaderType: RadaHeader
    opcodeFieldName: msgType
    messageOwnsHeader: true
    # Same protocol file as `rada` above, decoded with LITTLE_ENDIAN instead - demonstrates the
    # same message shapes decoding correctly under a different interface-level byte order.

  - key: pets
    name: Pets REST Interface
    protocol: REST
    port: 5060
    swaggerFile: swagger/pets-demo.yml
    # Operations (getPet, createPet) are auto-discovered from swaggerFile at startup - there's no
    # messages: list to hand-declare, unlike UDP/TCP interfaces, since REST has no per-operation
    # Java class to wire up.
