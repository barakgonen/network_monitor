autoReply:
  enabled: false

interfaces:
  - key: fruit
    name: Fruit Interface
    protocol: UDP
    port: 5001
    messages:
      - type: Orange
        messageClass: com.example.schemas.fruit.OrangeMessage
        opcode: 1001
      - type: Banana
        messageClass: com.example.schemas.fruit.BananaMessage
        opcode: 1002
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: weather
    name: Weather Interface
    protocol: UDP
    port: 5003
    messages:
      - type: TemperatureReading
        messageClass: com.example.schemas.weather.TemperatureReadingMessage
        opcode: 2001
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: ping
    name: Ping Interface
    protocol: UDP
    port: 5002
    messages:
      - type: Ping
        messageClass: com.example.schemas.ping.PingMessage
        opcode: 3001
      - type: Pong
        messageClass: com.example.schemas.ping.PongMessage
        opcode: 3002
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: candy
    name: Candy Interface
    protocol: TCP
    port: 5004
    messages:
      - type: Candy
        messageClass: com.example.schemas.candy.CandyMessage
        opcode: 4001
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: rada
    name: Rada Interface
    protocol: UDP
    port: 5050
    byteOrder: BIG_ENDIAN
    headerType: com.example.schemas.rada.struct.RadaHeader
    opcodeFieldName: msgType
    messageOwnsHeader: true
    messages:
      # Interface-level byteOrder (BIG_ENDIAN above) applies to every message here, including
      # this interface's own RadaExtendedStatus - compare with the `rada-le` interface below,
      # which decodes the same message type as LITTLE_ENDIAN instead.
      #
      # Note this can only be an interface-level split, not a per-message byteOrder: override
      # within a single messageOwnsHeader interface like this one: the ingestion pipeline must
      # peek this header (to read msgType and route to the right message class) *before* it
      # knows the message type, so that peek can only ever use the interface's own default -
      # there's no way to know a message-specific override applies until after the very read
      # that override would have needed to affect. Per-message byteOrder: overrides work
      # cleanly on the legacy envelope interfaces below instead (fruit/weather/ping/candy),
      # where the header is a separate, always-big-endian fixed struct decoded independently of
      # the body, so a body-only override never affects header routing.
      - type: RadaExtendedStatus
        messageClass: com.example.schemas.rada.messages.RadaExtendedStatus
        opcode: 1
      - type: RadaExtendedStatusMrs
        messageClass: com.example.schemas.rada.messages.RadaExtendedStatusMrs
        opcode: 2
      - type: RadaStatus
        messageClass: com.example.schemas.rada.messages.RadaStatus
        opcode: 3
      - type: RadaTracksExtended
        messageClass: com.example.schemas.rada.messages.RadaTracksExtended
        opcode: 4
    autoReply:
      enabled: false

  - key: rada-le
    name: Rada Interface (Little Endian Extended Status)
    protocol: UDP
    port: 5051
    byteOrder: LITTLE_ENDIAN
    headerType: com.example.schemas.rada.struct.RadaHeader
    opcodeFieldName: msgType
    messageOwnsHeader: true
    messages:
      # Only RadaExtendedStatus is wired up here - this interface exists purely to demonstrate
      # the same message class decoding correctly under a different interface-level byteOrder.
      - type: RadaExtendedStatus
        messageClass: com.example.schemas.rada.messages.RadaExtendedStatus
        opcode: 1
    autoReply:
      enabled: false
