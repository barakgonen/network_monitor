autoReply:
  enabled: false

interfaces:
  - key: fruit
    name: Fruit Interface
    protocol: UDP
    port: 25001
    serdesFile: ../serdes/fruit.protocol.json
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: weather
    name: Weather Interface
    protocol: UDP
    port: 25003
    serdesFile: ../serdes/weather.protocol.json
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: ping
    name: Ping Interface
    protocol: UDP
    port: 25002
    serdesFile: ../serdes/ping.protocol.json
    autoReply:
      enabled: false
      host: localhost
      port: 7001

  - key: candy
    name: Candy Interface
    protocol: TCP
    port: 25004
    serdesFile: ../serdes/candy.protocol.json
    autoReply:
      enabled: false
      host: localhost
      port: 7001

