interfaces:
  - key: fruit
    name: Fruit Interface
    protocol: UDP
    port: 25001
    serdesFile: ../serdes/fruit.protocol.json

  - key: weather
    name: Weather Interface
    protocol: UDP
    port: 25003
    serdesFile: ../serdes/weather.protocol.json

  - key: ping
    name: Ping Interface
    protocol: UDP
    port: 25002
    serdesFile: ../serdes/ping.protocol.json

  - key: candy
    name: Candy Interface
    protocol: TCP
    port: 25004
    serdesFile: ../serdes/candy.protocol.json

  - key: rada
    name: Rada Interface
    enabled: false
    protocol: UDP
    port: 25050
    byteOrder: BIG_ENDIAN
    serdesFile: ../serdes/rada.protocol.json
    serdesHeaderType: RadaHeader
    opcodeFieldName: msgType
    messageOwnsHeader: true

  - key: rada-le
    name: Rada Interface (Little Endian Extended Status)
    enabled: false
    protocol: UDP
    port: 25051
    byteOrder: LITTLE_ENDIAN
    serdesFile: ../serdes/rada.protocol.json
    serdesHeaderType: RadaHeader
    opcodeFieldName: msgType
    messageOwnsHeader: true

  - key: pets
    name: Pets REST Interface
    enabled: false
    protocol: REST
    port: 25060
    # Points at the real repo-root demo spec (not a synthetic test-only fixture) - proving the
    # actual demo config works when wired through the full real app (real schemas/messagehandlers
    # alongside it), not just in traffic-monitor-app-core's isolated REST-only test app.
    swaggerFile: ../swagger/pets-demo.yml
