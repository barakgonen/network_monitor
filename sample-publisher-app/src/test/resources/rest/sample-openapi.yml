openapi: 3.0.3
info:
  title: Test Items API
  description: Minimal fixture spec for PublisherEndToEndIT - deliberately separate from the repo-root swagger/pets-demo.yml so this test doesn't depend on that file's contents.
  version: "1.0.0"
paths:
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "abc"
                  name:
                    type: string
                    example: "Widget"
